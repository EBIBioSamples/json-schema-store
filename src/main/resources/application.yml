spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  data:
    rest:
      basePath: /api/v2

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      host-header: Host

management:
  endpoints:
    web:
      exposure:
        include: "*"
schemastore:
  cors:
    # Allowed origins for CORS (localhost, www, wwwdev, etc.). Override per environment.
    allowed-origins:
      - http://localhost:4200
      - http://localhost:3000
      - http://localhost:8080
      - http://127.0.0.1:4200
      - http://127.0.0.1:3000
      - http://127.0.0.1:8080
      - https://www.ebi.ac.uk
      - https://wwwdev.ebi.ac.uk
      - http://www.ebi.ac.uk
      - http://wwwdev.ebi.ac.uk

auth:
  api:
    url: https://www.ebi.ac.uk/ena/submit/webin/auth
ena:
  checklists:
    url: https://www.ebi.ac.uk/ena/submit/report/checklists
  checklist:
    groups:
      url: https://www.ebi.ac.uk/ena/submit/report/checklist-groups

logging:
  level:
    org:
      springframework:
        security: DEBUG
        data:
          rest:
            webmvc:
              json: INFO
        web: DEBUG
    uk:
      ac:
        ebi:
          biosamples:
            jsonschemastore: INFO
