variables:
  MAVEN_CLI_OPTS: "-DskipTests"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_TAG: $CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$DOCKER_TAG
  DOCKER_PULL_SECRET: docker-registry-secret
  APP_NAME: $CI_PROJECT_NAME

cache:
  paths:
    - .m2/repository/
    - target/

stages:
  - build
#  - test
  - publish
  - deploy

build:
  image: maven:3.8.3-openjdk-17
  stage: build
  variables:
    MONGO_URL: $DEV_MONGO_URL
  script:
    - mvn $MAVEN_CLI_OPTS clean package
  artifacts:
    paths:
      - target/json-schema-store-0.0.2.jar

build_docker_image:
  stage: publish
  image: docker:27
  tags: ["dind"]
  services:
    - docker:27-dind
  script:
    - docker --version
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t $DOCKER_IMAGE_NAME .
    - docker push --quiet $DOCKER_IMAGE_NAME
  after_script:
    - docker logout ${CI_REGISTRY}

deploy_dev_primary:
  variables:
    HOST: wwwint.ebi.ac.uk
    VALIDATOR_URL: https://wwwint.ebi.ac.uk/biosamples/biovalidator/validate
  environment:
    name: primary_hl_dev
    url: https://wwwint.ebi.ac.uk/biosamples/schema-store/api/v2
  extends: .kube_deploy_script
  when: manual

deploy_test_primary:
  variables:
    HOST: wwwdev.ebi.ac.uk
    VALIDATOR_URL: https://wwwdev.ebi.ac.uk/biosamples/biovalidator/validate
  environment:
    name: primary_hl_test
    url: https://wwwdev.ebi.ac.uk/biosamples/schema-store/api/v2
  extends: .kube_deploy_script
  when: manual

deploy_test_fallback:
  variables:
    HOST: wwwdev.ebi.ac.uk
    VALIDATOR_URL: https://wwwdev.ebi.ac.uk/biosamples/biovalidator/validate
  environment:
    name: fallback_hx_test
    url: https://wwwdev.ebi.ac.uk/biosamples/schema-store/api/v2
  extends: .kube_deploy_script
  when: manual

deploy_prod_primary:
  variables:
    HOST: www.ebi.ac.uk
    VALIDATOR_URL: https://www.ebi.ac.uk/biosamples/biovalidator/validate
  environment:
    name: primary_hl_prod
    url: https://www.ebi.ac.uk/biosamples/schema-store/api/v2
  only:
    - dev
    - master
  extends: .kube_deploy_script
  when: manual

deploy_prod_fallback:
  variables:
    HOST: www.ebi.ac.uk
    VALIDATOR_URL: https://www.ebi.ac.uk/biosamples/biovalidator/validate
  environment:
    name: fallback_hx_prod
    url: https://www.ebi.ac.uk/biosamples/schema-store/api/v2
  only:
    - dev
    - master
  extends: .kube_deploy_script
  when: manual

.kube_deploy_script:
  stage: deploy
  image: dtzar/helm-kubectl:3.16
  tags: ["dind"]
  services:
    - docker:27-dind
  script:
    - kubectl create namespace ${K8S_NAMESPACE} || true
    - echo ${K8S_NAMESPACE}
    - kubectl config set-context --current --namespace=${K8S_NAMESPACE}
    - kubectl delete secret $DOCKER_PULL_SECRET || true
    - kubectl create secret docker-registry $DOCKER_PULL_SECRET --docker-server=$CI_REGISTRY --docker-username=$CI_DEPLOY_USER --docker-password=$CI_DEPLOY_PASSWORD
    - mkdir k8s.$$
    - envsubst < k8s/configmap.yaml > k8s.$$/configmap.yaml
    - envsubst < k8s/deployment.yaml > k8s.$$/deployment.yaml
    - envsubst < k8s/service.yaml > k8s.$$/service.yaml
    - envsubst < k8s/ingress.yaml > k8s.$$/ingress.yaml
    - cat k8s.$$/ingress.yaml
    - kubectl apply -f k8s.$$/
    - kubectl rollout restart deployments json-schema-store

